---
name: Demo Nightly Release

"on":
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    uses: ebirn/freecad_tools/.github/workflows/publish-nightly-release.yml@main
    with:
      config_path: export_config.yml
      project_root: .
      gui_session: run
      dry_run: false
      nightly_tag: nightly
      bundle_name: demo-artifacts-nightly.tar.gz
      bundle_paths: >-
        README.md export_config.yml example.FCStd
        .github/workflows/demo-ci.yml
        .github/workflows/demo-release-dry-run.yml
        .github/workflows/demo-nightly-release.yml
      generated_paths: >-
        prints docs
