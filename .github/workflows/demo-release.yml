---
name: Tagged Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag name override for manual runs
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    uses: ebirn/freecad_tools/.github/workflows/reusable-publish-release.yml@main
    with:
      config_path: .freecad_tools/config.yml
      project_root: .
      gui_session: run
      dry_run: false
      is_rolling_release: false
      release_tag: ${{ github.event.inputs.release_tag || '' }}
      bundle_name: demo-artifacts
      bundle_paths: >-
        README.md INSTRUCTIONS.md .freecad_tools/config.yml example.FCStd
      generated_paths: >-
        docs prints
