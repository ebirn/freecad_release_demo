---
name: Demo Tagged Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag name override for manual runs
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: ebirn/freecad_tools/.github/workflows/publish-tagged-release.yml@main
    with:
      config_path: export_config.yml
      project_root: .
      gui_session: run
      dry_run: false
      release_tag: ${{ github.event.inputs.release_tag || '' }}
      bundle_name_prefix: demo-artifacts
      bundle_paths: >-
        README.md export_config.yml example.FCStd
        .github/workflows/demo-ci.yml
        .github/workflows/demo-release-dry-run.yml
        .github/workflows/demo-nightly-release.yml
      generated_paths: >-
        prints docs
